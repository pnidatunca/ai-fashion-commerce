<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shopping - Yeni Nesil E-Ticaret</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    
    <!-- Navbar / Header -->
    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">AI<span>Shopping</span></h1>
            <nav>
                <a href="#" class="active">Katalog</a>
                <a href="#">Yeni Gelenler</a>
                <a href="#">Trendler</a>
            </nav>
            <div class="nav-actions">
                <button class="icon-btn">🛒</button>
                <button class="icon-btn">👤</button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h2>Stilinizi Yapay Zeka İle Keşfedin</h2>
            <p>Sizin için özel seçilmiş binlerce ürün arasında kolayca arama yapın.</p>
            
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Örn: Siyah günlük sneaker..." />
                <button id="searchBtn" class="primary-btn">Ara</button>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container">
        
        <div class="content-header">
            <h3>Ürünlerimiz</h3>
            <div class="filter-sort">
                <span id="productCount">Yükleniyor...</span>
            </div>
        </div>

        <div class="layout-grid">
            <!-- Sidebar / Filters -->
            <aside class="sidebar glass">
                <h4>Filtreler</h4>
                <div class="filter-group">
                    <label>Kategori</label>
                    <select id="categoryFilter">
                        <option value="">Tümü</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Min Fiyat ($)</label>
                    <input type="number" id="minPriceFilter" placeholder="0">
                </div>
                <div class="filter-group">
                    <label>Max Fiyat ($)</label>
                    <input type="number" id="maxPriceFilter" placeholder="5000">
                </div>
                <button id="applyFiltersBtn" class="primary-btn" style="width: 100%; margin-top: 1rem;">Uygula</button>
            </aside>

            <!-- Products Grid -->
            <div id="productsGrid" class="products-grid">
                <!-- Loading Skeleton or Products will be injected here via JS -->
                <div class="loading-spinner"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 AI Shopping Platform. Tüm hakları saklıdır.</p>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
